<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOLO Face + Engagement</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121c30;
        --line: #2e3c5f;
        --text: #e6ecff;
        --accent: #63e6be;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        background: radial-gradient(circle at 20% 10%, #1b2a47, var(--bg));
        color: var(--text);
      }

      .wrap {
        max-width: 980px;
        margin: 24px auto;
        padding: 0 16px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 26px;
      }

      p {
        opacity: 0.9;
      }

      .stage {
        position: relative;
        width: min(100%, 900px);
        aspect-ratio: 4 / 3;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: #05070d;
      }

      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #status {
        margin-top: 14px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      .ok {
        color: var(--accent);
      }

      .warn {
        color: #ffd166;
      }

      .err {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>YOLO Face + Engagement (Client Camera)</h1>
      <p>This page uses your browser camera and sends frames to the server for prediction.</p>
      <div class="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="status">Initializing camera...</div>
    </main>

    <script>
      const video = document.getElementById("video");
      const overlay = document.getElementById("overlay");
      const ctx = overlay.getContext("2d");
      const statusEl = document.getElementById("status");
      const captureCanvas = document.createElement("canvas");
      const captureCtx = captureCanvas.getContext("2d");

      function setStatus(msg, cls) {
        statusEl.textContent = msg;
        statusEl.className = cls || "";
      }

      function drawPredictionBox(pred) {
        ctx.strokeStyle = "#63e6be";
        ctx.lineWidth = 3;
        ctx.strokeRect(pred.x, pred.y, pred.w, pred.h);

        const top = `Eng:${pred.engagement.toFixed(2)} Bor:${pred.boredom.toFixed(2)}`;
        const bottom = `Con:${pred.confusion.toFixed(2)} Fru:${pred.frustration.toFixed(2)}`;

        ctx.fillStyle = "#63e6be";
        ctx.font = "18px Segoe UI";
        ctx.fillText(top, pred.x, Math.max(22, pred.y - 8));
        ctx.fillText(bottom, pred.x, pred.y + pred.h + 22);
      }

      async function postFrame(blob) {
        const form = new FormData();
        form.append("frame", blob, "frame.jpg");

        const resp = await fetch("/predict_frame", {
          method: "POST",
          body: form,
        });

        if (!resp.ok) {
          throw new Error(`Server error ${resp.status}`);
        }

        return resp.json();
      }

      async function loop() {
        if (video.videoWidth === 0 || video.videoHeight === 0) {
          requestAnimationFrame(loop);
          return;
        }

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        captureCanvas.width = video.videoWidth;
        captureCanvas.height = video.videoHeight;

        captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

        captureCanvas.toBlob(async (blob) => {
          if (!blob) {
            setStatus("Failed to capture frame", "err");
            requestAnimationFrame(loop);
            return;
          }

          try {
            const result = await postFrame(blob);
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (result.predictions && result.predictions.length > 0) {
              drawPredictionBox(result.predictions[0]);
              setStatus("Prediction updated", "ok");
            } else {
              setStatus("No face detected", "warn");
            }
          } catch (err) {
            setStatus(`Inference failed: ${err.message}`, "err");
          }

          setTimeout(() => requestAnimationFrame(loop), 120);
        }, "image/jpeg", 0.75);
      }

      async function start() {
        const onLocalhost = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
        const secureAllowed = window.isSecureContext || onLocalhost;

        if (!secureAllowed) {
          setStatus(
            "Camera blocked by browser security. Open this page with HTTPS (or localhost).",
            "err"
          );
          return;
        }

        const legacyGetUserMedia =
          navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;

        try {
          const constraints = {
            video: { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false,
          };

          let stream;
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } else if (legacyGetUserMedia) {
            stream = await new Promise((resolve, reject) => {
              legacyGetUserMedia.call(navigator, constraints, resolve, reject);
            });
          } else {
            throw new Error("This browser does not support camera capture APIs.");
          }

          video.srcObject = stream;
          setStatus("Camera connected", "ok");
          requestAnimationFrame(loop);
        } catch (err) {
          setStatus(
            `Cannot access camera: ${err.message}`,
            "err"
          );
        }
      }

      start();
    </script>
  </body>
</html>
